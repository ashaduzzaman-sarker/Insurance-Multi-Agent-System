[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bimas"
version = "1.0.0"
description = "Bangladesh Insurance Multi-Agent System - Production-ready AI orchestrator for regulated insurance operations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ashaduzzaman Sarker", email = "ashaduzzaman2505@gmail.com"}
]
keywords = [
    "insurance",
    "multi-agent",
    "ai",
    "bangladesh",
    "idra",
    "compliance",
    "langgraph",
    "rag"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # LLM & AI Framework
    "langchain>=0.1.6",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.1",
    "langgraph>=0.0.40",
    "openai>=1.10.0",
    "anthropic>=0.18.1",
    
    # Vector Store & Embeddings
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.3.1",
    "numpy>=1.26.0,<2.0.0",
    
    # Document Processing
    "pypdf>=4.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.6",
    
    # PII Detection & Security
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
    
    # API Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    
    # Database
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    
    # Caching & Performance
    "redis>=5.0.0",
    
    # Monitoring & Logging
    "structlog>=24.1.0",
    "sentry-sdk>=1.39.0",
    
    # Utilities
    "tenacity>=8.2.3",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipython>=8.20.0",
]

# UI dependencies (optional)
ui = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pandas>=2.2.0",
]

# Production monitoring
monitoring = [
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
]

# All optional dependencies
all = [
    "bimas[dev,ui,monitoring]",
]

[project.urls]
Homepage = "https://github.com/your-org/bimas"
Documentation = "https://docs.bimas.example.com"
Repository = "https://github.com/your-org/bimas.git"
Issues = "https://github.com/your-org/bimas/issues"
Changelog = "https://github.com/your-org/bimas/blob/main/CHANGELOG.md"

[project.scripts]
# CLI entry points
bimas = "bimas.__main__:cli"
bimas-server = "bimas.api.main:run_server"
bimas-worker = "bimas.orchestrator.executor:run_worker"
bimas-ui = "bimas.ui.dashboard:run_dashboard"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bimas*"]
namespaces = false

[tool.setuptools.package-data]
bimas = ["py.typed", "*.yaml", "*.json"]

# ============================================================================
# BLACK - Code Formatter
# ============================================================================
[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

# ============================================================================
# RUFF - Fast Python Linter
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"

select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**/*.py" = ["S101"]  # assert allowed in tests

[tool.ruff.isort]
known-first-party = ["bimas"]

# ============================================================================
# MYPY - Static Type Checker
# ============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ============================================================================
# PYTEST - Testing Framework
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=bimas",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-ra",
    "--tb=short",
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "requires_llm: Tests requiring LLM API",
    "requires_db: Tests requiring database",
]

# ============================================================================
# COVERAGE - Code Coverage
# ============================================================================
[tool.coverage.run]
source = ["src/bimas"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/migrations/*",
]
branch = true

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# BANDIT - Security Linter
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B601"]

# ============================================================================
# ISORT - Import Sorting (used by ruff)
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["bimas"]
skip_gitignore = true
